[package]
name = "music-theory"
version = "1.0.0"
description = "MusicDay1 - 从零基础到掌握"
authors = ["musicDay1"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "music_theory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "music-theory"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
once_cell = "1"
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls"], default-features = false }
base64 = "0.22"
tokio = { version = "1", features = ["fs"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
